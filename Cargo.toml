[package]
edition = "2024"
name = "esp-pwm-motor"
rust-version = "1.88"
version = "0.1.0"

[[bin]]
name = "esp-pwm-motor"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.0", features = ["defmt", "esp32s3", "unstable"] }

esp-rtos = { version = "0.2.0", features = ["defmt", "embassy", "esp32s3", "esp-radio", "esp-alloc"] }
esp-alloc = { version = "0.9.0", features = ["defmt", "esp32s3"] }
esp-radio = { version = "0.17.0", features = ["defmt", "esp32s3", "wifi", "unstable"] }

defmt = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }

embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-net = { version = "0.9.0", features = ["defmt", "dhcpv4", "medium-ethernet", "tcp"] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
esp-backtrace = { version = "0.18.1", features = [
  "defmt",
  "esp32s3",
  "panic-handler",
] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s3"] }

critical-section = "1.2.0"
static_cell = "2.1.1"
picoserve = { version = "0.18.0", default-features = false, features = ["embassy"] }


[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.dev.package.esp-radio]
opt-level = 3

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false
